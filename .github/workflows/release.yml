name: Release
run-name: ${{ github.actor }}

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - name: Checkout respository
        uses: actions/checkout@v4

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --no-group dev

      - name: Run tests
        run: uv run pytest -v

  release:
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} .

      - name: Push to GitHub Packages
        run: docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Save Docker image as .tar
        run: docker save -o tg-bot-progress-back-end.tar ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Create .zip archive
        run: zip -r tg-bot-progress-back-end.zip . -x ".git/*" ".venv/*" "*.tar"

      - name: Create .tar.gz archive
        run: tar -czf tg-bot-progress-back-end.tar.gz --exclude=".git" --exclude=".venv" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            tg-bot-progress-back-end.tar
            tg-bot-progress-back-end.zip
            tg-bot-progress-back-end.tar.gz